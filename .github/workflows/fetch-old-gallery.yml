# Служебный workflow: скачивает фото со CDN старого сайта и складывает
# в артефакт old-gallery. Запуск вручную: gh workflow run fetch-old-gallery.yml
name: Fetch old gallery photos

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download photos from old site CDN
        run: |
          mkdir -p photos
          BASE="https://274418.selcdn.ru/cv08300-33250f0d-0664-43fc-9dbf-9d89738d114e/uploads/690152"
          ok=0; fail=0
          while read -r name; do
            [ -z "$name" ] && continue
            code=$(curl -s -o "photos/$name.jpg" -w "%{http_code}" -m 40 "$BASE/$name.jpg" || echo err)
            size=$(stat -c%s "photos/$name.jpg" 2>/dev/null || echo 0)
            echo "$name -> $code (${size}b)"
            if [ "$code" = "200" ] && [ "$size" -gt 10000 ]; then
              ok=$((ok+1))
            else
              fail=$((fail+1)); rm -f "photos/$name.jpg"
            fi
          done < scripts/old-gallery-urls.txt
          echo "OK: $ok, FAIL: $fail"
          ls -la photos | head -60

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: old-gallery
          path: photos
          retention-days: 1
